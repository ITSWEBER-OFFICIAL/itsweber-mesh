<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2230">
<title>Mesh, keine Verbindung</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:linear-gradient(170deg,#0f2230,#143544);color:#eaf2f4;
    font:16px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
    padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
  main{max-width:340px;text-align:center}
  img{width:64px;height:64px;border-radius:16px;border:1px solid rgba(234,242,244,.14)}
  h1{font-size:24px;line-height:1.2;margin:18px 0 8px;font-weight:650;text-wrap:balance}
  p{margin:0 0 22px;color:#9fb6bf}
  button{font:600 15px inherit;font-family:inherit;min-height:48px;padding:0 24px;border-radius:999px;border:0;background:#5eead4;color:#0f2230;cursor:pointer}
  button:focus-visible{outline:2px solid #eaf2f4;outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/icons/app-icon-192.png" alt="" width="64" height="64">
  <h1>Keine Verbindung zu Mesh</h1>
  <p>Der Server ist von hier aus gerade nicht erreichbar. Prüfe dein Netz und versuch es noch einmal.</p>
  <button type="button" onclick="location.reload()">Erneut versuchen</button>
</main>
</body>
</html>
